# mihomo (Clash Meta) 配置快照（脱敏版，lovelive 套）
#
# 来源：Pi 5 主机 /root/.config/mihomo/config.yaml（2026-10-09）
# 用途：归档当前生效的 mihomo 配置，便于回滚或在其他机器复现
# 完整说明：见 PROJECTWIKI.md §8.4.5「Mihomo/Tailscale 共存配置（2026-10 修复）」
#
# ⚠️ 此快照**已脱敏**：`proxies` 段（vless + reality 凭证）已删除，部署时请用
# 自己的代理节点替换。`rules` 段完整保留（这是修复的关键点）。
#
# 🔄 2026-10-09 更新：从 microsoft 套切到 lovelive 套（uuid 2ea271b4）
# 原因：server 端 systemd xray 在 2026-07-10 已被改成 lovelive 配置
# microsoft 套旧凭据已从仓库脱敏，仅 server 端 /usr/local/etc/xray 历史备份留存
# 详见 racknerdVPN 项目 README.md「配置变更历史」

# ---- 监听端口（HTTP/SOCKS5/controller）----
port: 7890              # HTTP 代理
socks-port: 7891        # SOCKS5 代理
allow-lan: true
log-level: info
external-controller: 127.0.0.1:9090  # RESTful API（dashboard）

dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: redir-host
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback:
    - 1.0.0.1
    - 8.8.4.4

# ---- proxies 段：vless/reality 凭证已脱敏，部署时请自行填写 ----
# 模板（lovelive 套，可参考）：
#   proxies:
#     - name: "RackNerd-averypi"
#       type: vless
#       server: 75.127.13.29
#       port: 443
#       uuid: <YOUR_UUID>
#       network: tcp
#       tls: true
#       udp: true
#       flow: xtls-rprx-vision
#       servername: <YOUR_SNI>
#       reality-opts:
#         public-key: <YOUR_PBK>     # x25519 公钥
#         short-id: <YOUR_SID>       # hex 8 字节
#         spider-x: "/"               # 默认路径
#       client-fingerprint: chrome
proxies: []
proxy-groups:
  - name: "Proxy"
    type: select
    proxies:
      - DIRECT            # 占位：实际使用时请把代理节点填到 proxies 段

# ---- rules（核心修复点）----
# 关键：新增 `IP-CIDR,100.64.0.0/10,DIRECT`，放行 Tailscale tailnet 段
# 原因：Tailscale 装上后 CGNAT 段默认被代理吃，导致回环 → 整网掉速
rules:
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT    # ← Tailscale tailnet 直连（2026-10-09 新增）
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
