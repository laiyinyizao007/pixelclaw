name: Add Issue to Project

on:
  issues:
    types:
      - opened
      - reopened
      - transferred
  workflow_dispatch:

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/${{ vars.PROJECT_OWNER_TYPE || 'users' }}/${{ github.repository_owner }}/projects/${{ vars.PROJECT_NUMBER }}
          # 使用 PROJECT_TOKEN 而非 GITHUB_TOKEN：私有仓库上 GITHUB_TOKEN
          # 默认无 projects: write 权限，会 403。PAT 需 scope: repo + project。
          github-token: ${{ secrets.PROJECT_TOKEN }}
