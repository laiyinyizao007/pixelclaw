name: Generate Issue Task List
on:
  issues:
    types: [opened]
jobs:
  generate:
    if: |
      !contains(github.event.issue.body || '', '- [ ]') &&
      github.event.issue.title != null &&
      github.event.issue.title != ''
    uses: laiyinyizao007/my-project-management/.github/workflows/reusable-tasklist.yml@main
    permissions:
      issues: write
