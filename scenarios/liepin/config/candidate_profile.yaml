# 候选人求职偏好配置 — 猎聘版

# ── 薪资 ──────────────────────────────────────────────────────────────────────
min_salary_k: 18          # 月薪下限（K）；CLI --min-salary 可覆盖

# ── 分数阈值 ──────────────────────────────────────────────────────────────────
default_threshold: 7      # 打招呼最低分
daily_hard_limit: 100     # 每日发送上限；猎聘直聊较严格，保守设为 100

# ── 评分维度权重（各维度 0-10 分，最终 = Σ(维度分 × weight)，weight 之和须为 1.0）
scoring_dimensions:
  role_fit:
    label: "职能适配"
    weight: 0.30
    desc: "候选人的产品/FDE/AI/设计背景与岗位核心职责的契合度"
  skill_match:
    label: "技能匹配"
    weight: 0.30
    desc: "核心技能与JD要求的匹配度；候选人优势：AI工具/Vibe Coding全栈交付、产品设计、Design System"
  ai_native:
    label: "AI原生度"
    weight: 0.20
    desc: "岗位是否接受AI辅助开发风格；JD出现Vibe Coding/AI工具/Claude/Cursor等词汇则满分"
  growth_fit:
    label: "成长潜力"
    weight: 0.10
    desc: "候选人学习能力强+抽象思维强，能否快速弥补当前差距"
  basic_fit:
    label: "基本条件"
    weight: 0.10
    desc: "用工性质（全职正式岗满分）、经验年限、薪资区间是否匹配"

# ── 地点权重 ─────────────────────────────────────────────────────────────────
location_weights:
  上海: 1.0
  杭州: 0.95
  南京: 0.9
  北京: 0.9
  深圳: 0.9
  广州: 0.85
  成都: 0.85
  武汉: 0.8
  远程: 1.1
  全远程: 1.1
  default: 1.0

# ── 岗位过滤（标题命中 blocklist 且不含 exemptions → 跳过）────────────────────
role_blocklist:
  - 实习
  - 实习生
  - 兼职
  - 外包

# ── 详情页内容过滤（进入详情后、LLM 之前执行）────────────────────────────────────
description_filters:
  industry_blocklist:
    - 保险公司
    - 寿险
    - 财险
    - 险种
    - 保险销售
    - 保险顾问
    - 保险经纪
    - 保险代理
    - 保险产品
  min_base_salary_k: 12

role_exemptions:
  - 产品
  - PM
  - 经理
  - 负责人
  - AI产品
  - 研发管理

# ── 公司规模权重（猎聘格式：100-299人 / 300-999人 等）──────────────────────────
company_size_weights:
  20人以下: 0.9
  20-99人: 0.95
  100-299人: 1.0
  300-999人: 1.05
  1000-9999人: 1.1
  10000人以上: 1.15
  default: 1.0

# ── 互联网大厂权重 ──────────────────────────────────────────────────────────
company_tier_weights:
  阿里: 1.15
  蚂蚁: 1.15
  腾讯: 1.15
  字节: 1.15
  抖音: 1.12
  百度: 1.12
  华为: 1.15
  美团: 1.12
  京东: 1.12
  拼多多: 1.12
  快手: 1.10
  小红书: 1.10
  哔哩: 1.10
  B站: 1.10
  滴滴: 1.10
  小米: 1.10
  网易: 1.10
  微博: 1.08
  携程: 1.08
  vivo: 1.08
  OPPO: 1.08
  微软: 1.12
  谷歌: 1.15
  苹果: 1.15
  亚马逊: 1.12
  Meta: 1.12
  default: 1.0

# ── 发布时间权重 ─────────────────────────────────────────────────────────────
recency_weights:
  within_1d: 1.15
  within_3d: 1.1
  within_7d: 1.05
  within_30d: 1.0
  older: 0.95
  unknown: 1.0

# ── HR 活跃度权重（猎聘格式，与 BOSS直聘 相同：显示"今日活跃"/"3天前活跃"等数字天数）─
# 从显示文字解析天数 → 命中区间 → 权重
# 解析逻辑在 smart_match_greet.py 的 _extract_hr_active_days() 中
hr_active_weights:
  today:      1.15   # 今日活跃 / 刚刚活跃 / 0-1天
  within_3d:  1.10   # 2-3天内活跃
  within_7d:  1.05   # 4-7天内活跃
  within_30d: 1.0    # 8-30天内活跃
  older:      0.90   # 超过 30 天
  unknown:    1.0    # 无法解析
