    阿里: [饿了么, 高德, 优酷, UC, 钉钉, 菜鸟, 闲鱼, 淘宝, 天猫, 盒马, "1688", 阿里影业, 阿里云]
    腾讯: [微信, 微信支付, QQ, 腾讯视频, 腾讯音乐, 阅文, 起点, Riot, 腾讯影业, 腾讯云, QQ音乐, 元宝]
    百度: [百度网盘, 文心一言, 小度, 百度地图, 百度文库, 百度智能云]
