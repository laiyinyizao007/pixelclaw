# 候选人求职偏好配置 — 所有字段均可被对应 CLI 参数覆盖

# ── 薪资 ──────────────────────────────────────────────────────────────────────
min_salary_k: 24          # 月薪下限（K）；CLI --min-salary 可覆盖

# ── 分数阈值 ──────────────────────────────────────────────────────────────────
default_threshold: 7      # 打招呼最低分；CLI --threshold 可覆盖

# ── 评分维度权重（各维度 0-10 分，最终 = Σ(维度分 × weight)，weight 之和须为 1.0）
scoring_dimensions:
  role_fit:
    label: "职能适配"
    weight: 0.30
    desc: "候选人的产品/FDE/AI/设计背景与岗位核心职责的契合度；完全对口产品/AI原生岗满分，纯传统工程研发岗且无AI工具要求则低分"
  skill_match:
    label: "技能匹配"
    weight: 0.30
    desc: "核心技能与JD要求的匹配度；候选人优势包括：AI工具/Vibe Coding全栈交付、产品设计、Design System、抽象思维、审美、沟通表达、学习能力；有对应则高分"
  ai_native:
    label: "AI原生度"
    weight: 0.20
    desc: "岗位是否接受AI辅助开发风格；JD出现Vibe Coding/AI工具/Claude/Cursor等词汇则满分，纯传统工程深度优先则低分"
  growth_fit:
    label: "成长潜力"
    weight: 0.10
    desc: "候选人学习能力强+抽象思维强，能否快速弥补当前差距；差距为软性且候选人有过跨领域快速上手记录则高分"
  basic_fit:
    label: "基本条件"
    weight: 0.10
    desc: "用工性质（全职正式岗满分，实习/兼职/外包/按天计薪/在校生优先则 0-1 分）、经验年限、薪资区间是否匹配；行业经验仅强制要求才算差距（加分项不扣分）；大厂背景/P7+要求视为轻微差距"

# ── 地点权重 ─────────────────────────────────────────────────────────────────
# 从 JD description 前 500 字 + company_info 中提取城市名，
# 将 LLM 原始分 × weight 后取整（≥1），再与 threshold 比较
# 1.0 = 不调整；< 1.0 = 降权；0 = 直接跳过（不进 LLM）
location_weights:
  上海: 1.0
  杭州: 0.95
  南京: 0.9
  北京: 0.9
  深圳: 0.9
  广州: 0.85
  成都: 0.85
  武汉: 0.8
  远程: 1.1
  全远程: 1.1
  default: 1.0            # 未识别城市的兜底权重（不降权，避免误杀 vibe coding 等新兴岗）

# ── 岗位过滤 ─────────────────────────────────────────────────────────────────
# 标题命中 blocklist 且不含 exemptions → 跳过，不进 LLM
role_blocklist:
  - 实习
  - 实习生
  - 兼职
  - 外包

# ── 详情页内容过滤（进入详情后、LLM 之前执行）────────────────────────────────────
description_filters:
  # 命中任意关键词则跳过（区分保险行业 vs 保险福利：用业务词而非「保险」本身）
  industry_blocklist:
    - 保险公司
    - 寿险
    - 财险
    - 险种
    - 保险销售
    - 保险顾问
    - 保险经纪
    - 保险代理
    - 保险产品
  min_base_salary_k: 12   # 底薪低于此值（K）则跳过；0 = 不过滤

role_exemptions:
  - 产品
  - PM
  - 经理
  - 负责人
  - AI产品
  - 研发管理

# ── 公司规模权重（人员规模，来自 company_info 解析）─────────────────────────
# BOSS直聘实际值：0-20人 / 20-99人 / 100-499人 / 500-999人 / 1000-9999人 / 10000人以上
company_size_weights:
  0-20人: 0.9
  20-99人: 0.95
  100-499人: 1.0
  500-999人: 1.05
  1000-9999人: 1.1
  10000人以上: 1.15
  default: 1.0

# ── 融资阶段权重（来自 company_info 解析）──────────────────────────────────
# BOSS直聘实际值：已上市 / D轮及以上 / C轮 / B轮 / A轮 / 天使轮 / 不需要融资 / 未融资
financing_weights:
  已上市: 1.1
  D轮及以上: 1.05
  C轮: 1.02
  B轮: 1.0
  A轮: 0.98
  天使轮: 0.95
  不需要融资: 1.05   # 盈利自营，稳定
  未融资: 0.9        # 阶段不明，偏保守
  default: 1.0

# ── 互联网大厂权重（公司名含关键词则乘以对应系数）──────────────────────────────
# 规则：遍历所有 pattern，取命中中最高权重；未命中则用 default
company_tier_weights:
  # 一线（BAT+字节+华为）
  阿里: 1.15
  蚂蚁: 1.15
  腾讯: 1.15
  字节: 1.15
  抖音: 1.12   # 字节旗下独立主体
  百度: 1.12
  华为: 1.15
  # 二线（美团/京东/拼多多/快手/小红书/B站等）
  美团: 1.12
  京东: 1.12
  拼多多: 1.12
  快手: 1.10
  小红书: 1.10
  哔哩: 1.10
  B站: 1.10
  滴滴: 1.10
  小米: 1.10
  网易: 1.10
  # 三线（微博/携程/vivo/OPPO/荣耀/UCloud等）
  微博: 1.08
  携程: 1.08
  vivo: 1.08
  OPPO: 1.08
  荣耀: 1.08
  UCloud: 1.08
  # 外资大厂
  微软: 1.12
  谷歌: 1.15
  苹果: 1.15
  亚马逊: 1.12
  Meta: 1.12
  default: 1.0

# ── 发布时间权重（天数区间 → 权重） ──────────────────────────────────────────
# raw_texts 中解析 "N天前" / "刚刚" 等字符串
recency_weights:
  within_1d: 1.15    # 1天内（含刚刚/小时内）
  within_3d: 1.1     # 3天内
  within_7d: 1.05    # 7天内
  within_30d: 1.0    # 30天内
  older: 0.95        # 超过30天
  unknown: 1.0       # 无法解析时不调整
