# 候选人求职偏好配置 — 所有字段均可被对应 CLI 参数覆盖

# ── 薪资 ──────────────────────────────────────────────────────────────────────
min_salary_k: 24          # 月薪下限（K）；CLI --min-salary 可覆盖

# ── 分数阈值 ──────────────────────────────────────────────────────────────────
default_threshold: 7      # 打招呼最低分；CLI --threshold 可覆盖

# ── 地点权重 ─────────────────────────────────────────────────────────────────
# 从 JD description 前 500 字 + company_info 中提取城市名，
# 将 LLM 原始分 × weight 后取整（≥1），再与 threshold 比较
# 1.0 = 不调整；< 1.0 = 降权；0 = 直接跳过（不进 LLM）
location_weights:
  上海: 1.0
  杭州: 0.95
  南京: 0.9
  北京: 0.9
  深圳: 0.9
  广州: 0.85
  成都: 0.85
  武汉: 0.8
  远程: 0.95
  全远程: 1.0
  default: 0.75           # 未识别城市的兜底权重

# ── 岗位过滤 ─────────────────────────────────────────────────────────────────
# 标题命中 blocklist 且不含 exemptions → 跳过，不进 LLM
role_blocklist: []
# 全部交给 LLM 甄别，不在标题层面预过滤

# ── 详情页内容过滤（进入详情后、LLM 之前执行）────────────────────────────────────
description_filters:
  # 命中任意关键词则跳过（区分保险行业 vs 保险福利：用业务词而非「保险」本身）
  industry_blocklist:
    - 保险公司
    - 寿险
    - 财险
    - 险种
    - 保险销售
    - 保险顾问
    - 保险经纪
    - 保险代理
    - 保险产品
  min_base_salary_k: 12   # 底薪低于此值（K）则跳过；0 = 不过滤

role_exemptions:
  - 产品
  - PM
  - 经理
  - 负责人
  - AI产品
  - 研发管理
