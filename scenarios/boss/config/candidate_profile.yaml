    - "1688"
    - UC
    - QQ
    - Riot
    - POCO
    - Redmi
    - 黑鲨

# ── 发布时间权重（天数区间 → 权重） ──────────────────────────────────────────
# raw_texts 中解析 "N天前" / "刚刚" 等字符串
recency_weights:
  within_1d: 1.15    # 1天内（含刚刚/小时内）
  within_3d: 1.1     # 3天内
  within_7d: 1.05    # 7天内
  within_30d: 1.0    # 30天内
  older: 0.95        # 超过30天
  unknown: 1.0       # 无法解析时不调整

# ── HR 活跃度权重（天数区间 → 权重） ──────────────────────────────────────────
# hr_active 字段原始文本（"今天活跃"/"3天前活跃"/"本周活跃"等）数值化后查表
hr_active_weights:
  today: 1.10        # 今天活跃（0天）
  within_3d: 1.05    # 3天内
  within_7d: 1.00    # 本周活跃（不调整）
  within_30d: 0.95   # 本月活跃
  older: 0.90        # 超过30天
  unknown: 1.00      # 无活跃信息时不调整
